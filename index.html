<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Little Routines">
<meta name="application-name" content="Little Routines">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E6F2FC">
<meta name="color-scheme" content="light">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#FBFDFF}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Little Routines</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
  :root{
    --sky:#E6F2FC; --sky2:#FBFDFF; --card:#FFFFFF; --ink:#22335A; --muted:#6B7A99;
    --sun:#FFB020; --sun-soft:#FFE1A3; --grass:#47B87A; --grass-dark:#2F8F5C;
    --track:#D8E5F3; --knob:#FFFFFF; --border:#C9D8EA; --shadow:0 6px 18px rgba(34,51,90,.10);
    --done:#47B87A; --done-ink:#0F3D26; --hill:#7FCB8F; --hill2:#59B46F;
    --panel:#FFFFFF; --danger:#E0554B;
  }
  /* Morning is always light, night always dark, any-time always dusk — the device's dark-mode setting is ignored */
  :root{color-scheme:light}
  html,body{height:100%;}
  body{
    margin:0; background:var(--sky2); color:var(--ink);
    font-family:"Nunito", "Segoe UI", system-ui, sans-serif; font-weight:600;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

  #app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr;}
  @media (min-width:820px) and (orientation:landscape){
    #app{grid-template-columns:minmax(360px,46%) 1fr;grid-template-rows:1fr;}
    #stage{height:100% !important;border-radius:0 28px 28px 0;}
  }

  /* ---------- Stage ---------- */
  #stage{
    position:relative;height:min(40vh,420px);min-height:230px;overflow:hidden;container-type:inline-size;
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);
    border-radius:0 0 28px 28px;
  }
  .top{
    position:absolute;inset:0 0 auto 0;display:flex;align-items:center;justify-content:space-between;
    padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;gap:12px;z-index:3;
  }
  .greet{min-width:0;font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(16px,4.3vw,28px);line-height:1.1;}
  .pill button.emoji{padding:0 6px;font-size:15px}
  .greet small{display:block;font-family:"Nunito",sans-serif;font-weight:700;font-size:13px;color:var(--muted);margin-top:2px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .controls{display:flex;gap:6px;align-items:center;flex:none}
  .pill{
    display:inline-flex;align-items:center;background:var(--card);border:2px solid var(--border);border-radius:999px;
    padding:3px;box-shadow:var(--shadow);height:38px;
  }
  .pill button{padding:0 8px;height:28px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted);letter-spacing:.03em}
  .pill button[aria-pressed="true"]{background:var(--sun);color:#2B1B00}
  .icon-btn{width:38px;height:38px;border-radius:999px;background:var(--card);border:2px solid var(--border);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}

  .sun{
    position:absolute;right:12%;top:18%;width:min(22vw,110px);aspect-ratio:1;border-radius:50%;
    background:var(--sun);box-shadow:0 0 0 18px var(--sun-soft),0 0 60px 20px var(--sun-soft);
    animation:sunspin 40s linear infinite;
  }
  .sun::before{content:"";position:absolute;inset:-34px;border-radius:50%;
    background:repeating-conic-gradient(from 0deg,transparent 0 14deg,rgba(255,176,32,.35) 14deg 18deg);
    -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
  @keyframes sunspin{to{transform:rotate(360deg)}}
  .cloud{position:absolute;background:var(--card);opacity:.9;border-radius:999px;height:22px;width:80px;animation:drift 38s linear infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
  .cloud::before{width:34px;height:34px;left:14px;top:-16px}.cloud::after{width:26px;height:26px;left:40px;top:-10px}
  .c1{left:-90px;top:26%;animation-delay:-8s}.c2{left:-90px;top:12%;transform:scale(.7);animation-delay:-24s;animation-duration:52s}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 120px))}}
  .hill{position:absolute;left:-20%;right:-20%;bottom:-38%;height:60%;border-radius:50% 50% 0 0;background:var(--hill)}
  .hill.h2{left:30%;right:-40%;bottom:-46%;background:var(--hill2)}

  .animal-wrap{position:absolute;left:50%;bottom:12%;width:min(46vw,210px);aspect-ratio:1;transform:translateX(-50%);transform-origin:50% 60%;z-index:2}
  @media (min-width:820px) and (orientation:landscape){.animal-wrap{width:min(24vw,300px);bottom:16%}}
  .animal{position:relative;width:100%;height:100%;animation:idle 3s ease-in-out infinite;transform-origin:50% 100%}
  .animal svg{width:100%;height:100%;display:block;overflow:visible}
  .eye{transition:transform .15s;transform-box:fill-box;transform-origin:center}
  .happy .eye{transform:scaleY(.18)}
  .happy .mouth-open{opacity:1}
  .mouth-open{opacity:0}
  @keyframes idle{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.97) translateY(1%)}}

  .anim-spin{animation:spin 1.25s linear 4}
  @keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
  .anim-jump{animation:jump 5s ease-in-out 1}
  @keyframes jump{
    0%,20%,40%,60%,80%,100%{transform:translateX(-50%) translateY(0) scaleY(1)}
    3%,23%,43%,63%,83%{transform:translateX(-50%) translateY(4%) scaleY(.88)}
    10%,30%,50%,70%,90%{transform:translateX(-50%) translateY(-45%) scaleY(1.08)}
  }
  .anim-roll{animation:roll 2.5s ease-in-out 2}
  @keyframes roll{
    0%{transform:translateX(-50%) rotate(0)}
    50%{transform:translateX(calc(-50% + 110%)) rotate(360deg)}
    100%{transform:translateX(-50%) rotate(720deg)}
  }
  .anim-rollback{animation:rollback 2.5s ease-in-out 2}
  @keyframes rollback{
    0%{transform:translateX(-50%) rotate(0)}
    50%{transform:translateX(calc(-50% - 110%)) rotate(-360deg)}
    100%{transform:translateX(-50%) rotate(-720deg)}
  }
  .anim-grow{animation:grow 2.5s ease-in-out 2}
  @keyframes grow{
    0%{transform:translateX(-50%) scale(1) rotate(0)}
    30%{transform:translateX(-50%) scale(1.55) rotate(-6deg)}
    45%{transform:translateX(-50%) scale(1.6) rotate(6deg)}
    60%{transform:translateX(-50%) scale(1.55) rotate(-6deg)}
    75%{transform:translateX(-50%) scale(1.6) rotate(6deg)}
    100%{transform:translateX(-50%) scale(1) rotate(0)}
  }
  .anim-dance{animation:dance 5s ease-in-out 1}
  @keyframes dance{
    0%,100%{transform:translateX(-50%) rotate(0)}
    12%{transform:translateX(-95%) translateY(-10%) rotate(-14deg)}
    25%{transform:translateX(-50%) rotate(0)}
    37%{transform:translateX(-5%) translateY(-10%) rotate(14deg)}
    50%{transform:translateX(-50%) rotate(0)}
    62%{transform:translateX(-95%) translateY(-10%) rotate(-14deg)}
    75%{transform:translateX(-50%) rotate(0)}
    87%{transform:translateX(-5%) translateY(-10%) rotate(14deg)}
  }
  /* Exit: three hops travelling right, the third one off the screen; straight back in from the left with small hops */
  .anim-exit{animation:exit 5s linear 1}
  @keyframes exit{
    0%   {transform:translateX(-50%) translateY(0) scaleY(1)}
    3%   {transform:translateX(-50%) translateY(4%) scaleY(.9)}
    9%   {transform:translateX(calc(-50% + 7cqw)) translateY(-40%) rotate(5deg)}
    15%  {transform:translateX(calc(-50% + 14cqw)) translateY(0) scaleY(1) rotate(0)}
    18%  {transform:translateX(calc(-50% + 14cqw)) translateY(4%) scaleY(.9)}
    24%  {transform:translateX(calc(-50% + 23cqw)) translateY(-44%) rotate(6deg)}
    30%  {transform:translateX(calc(-50% + 32cqw)) translateY(0) scaleY(1) rotate(0)}
    33%  {transform:translateX(calc(-50% + 32cqw)) translateY(4%) scaleY(.9)}
    39%  {transform:translateX(calc(-50% + 58cqw)) translateY(-55%) rotate(10deg)}
    45%  {transform:translateX(calc(-50% + 90cqw)) translateY(-10%) rotate(12deg)}
    45.01%{transform:translateX(calc(-50% - 90cqw)) translateY(0) rotate(0)}
    50%  {transform:translateX(calc(-50% - 68cqw)) translateY(-30%) rotate(-6deg)}
    56%  {transform:translateX(calc(-50% - 48cqw)) translateY(0) rotate(0)}
    61%  {transform:translateX(calc(-50% - 36cqw)) translateY(-26%) rotate(-5deg)}
    67%  {transform:translateX(calc(-50% - 24cqw)) translateY(0) rotate(0)}
    72%  {transform:translateX(calc(-50% - 15cqw)) translateY(-22%) rotate(-4deg)}
    78%  {transform:translateX(calc(-50% - 7cqw)) translateY(0) rotate(0)}
    83%  {transform:translateX(calc(-50% - 3cqw)) translateY(-16%) rotate(-3deg)}
    89%  {transform:translateX(-50%) translateY(0) scaleY(1) rotate(0)}
    93%  {transform:translateX(-50%) translateY(3%) scaleY(.92)}
    100% {transform:translateX(-50%) translateY(0) scaleY(1)}
  }
  .anim-flip{animation:flip 2.5s cubic-bezier(.3,.6,.4,1) 2}
  @keyframes flip{
    0%{transform:translateX(-50%) translateY(0) rotate(0)}
    15%{transform:translateX(-50%) translateY(6%) scaleY(.85) rotate(0)}
    55%{transform:translateX(-50%) translateY(-70%) rotate(-200deg)}
    100%{transform:translateX(-50%) translateY(0) rotate(-360deg)}
  }
  .anim-hello{animation:hello .9s ease-in-out 1}
  @keyframes hello{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-8deg) scale(1.06)}75%{transform:translateX(-50%) rotate(8deg) scale(1.06)}}
  @media (prefers-reduced-motion:reduce){
    .animal,.sun,.cloud{animation:none}
    .anim-spin,.anim-jump,.anim-roll,.anim-rollback,.anim-grow,.anim-dance,.anim-flip,.anim-exit,.anim-launch,
    .anim-hero-stomp{animation:hello .9s ease-in-out 1}
    .cape{animation:none}
  }

  .friend-tag{
    position:absolute;left:16px;bottom:14px;z-index:3;background:var(--card);border:2px solid var(--border);
    border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;color:var(--muted);box-shadow:var(--shadow);
  }
  .friend-tag b{color:var(--ink);font-family:"Fredoka",sans-serif;font-weight:600;font-size:15px}

  /* ---------- Steps ---------- */
  #list{min-height:0;overflow-y:auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
  .stars{display:flex;justify-content:center;gap:6px;padding:2px 0 4px;font-size:22px;line-height:1}
  .stars span{filter:grayscale(1);opacity:.35;transition:all .3s}
  .stars span.on{filter:none;opacity:1;transform:scale(1.15)}

  .step{
    background:var(--card);border:2px solid var(--border);border-radius:22px;padding:12px 12px 12px;
    box-shadow:var(--shadow);display:grid;gap:10px;transition:border-color .3s,opacity .3s;
  }
  .step.next{border-color:var(--sun)}
  .step.done{border-color:var(--done)}
  .step-head{display:flex;align-items:center;gap:10px;padding:0 4px}
  .step-num{
    width:28px;height:28px;border-radius:50%;background:var(--track);display:grid;place-items:center;
    font-family:"Fredoka",sans-serif;font-weight:700;font-size:15px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums
  }
  .step.done .step-num{background:var(--done);color:#fff}
  .step.next .step-num{background:var(--sun);color:#2B1B00}
  .step-name{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(20px,5vw,26px);line-height:1.1;flex:1;text-wrap:balance}
  .step-name button{text-align:left;font:inherit}
  .step-do{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.02em}
  .step.done .step-do{color:var(--grass-dark)}

  .track{
    position:relative;height:66px;border-radius:999px;background:var(--track);overflow:hidden;touch-action:pan-y;
  }
  .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--done);border-radius:999px;opacity:.9}
  .hint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:60px;
    font-weight:800;color:var(--muted);font-size:15px;letter-spacing:.01em;pointer-events:none;
    animation:shimmer 2.4s ease-in-out infinite;
  }
  .step.done .hint{color:var(--done-ink);animation:none;padding-left:0;padding-right:60px}
  @keyframes shimmer{0%,100%{opacity:.55}50%{opacity:1}}
  .knob{
    position:absolute;top:5px;left:5px;width:56px;height:56px;border-radius:50%;background:var(--knob);
    display:grid;place-items:center;font-size:30px;box-shadow:0 4px 12px rgba(34,51,90,.22);
    border:2.5px solid #22335A;will-change:transform;cursor:grab;touch-action:none;
  }
  .knob svg{width:38px;height:38px;display:block}
  .ico-emoji{display:block;line-height:1;font-size:32px}
  .tile .ico-emoji{font-size:min(8vw,38px)}
  .ed-item .ico-emoji{font-size:24px;flex:none}
  .ed-add .ico-emoji{font-size:24px}
  .knob:active{cursor:grabbing}
  .step.done .knob{background:var(--done);border-color:var(--grass-dark)}
  .step.done .track{pointer-events:none}

  .banner{
    background:var(--done);color:#0F3D26;border-radius:22px;padding:16px 18px;text-align:center;
    font-family:"Fredoka",sans-serif;font-weight:700;font-size:24px;
  }

  /* ---------- Parent ---------- */
  #gear{
    position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;
    width:44px;height:44px;border-radius:50%;background:var(--card);border:2px solid var(--border);
    box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;opacity:.75
  }
  #gear .ring{position:absolute;inset:-4px;border-radius:50%;border:4px solid var(--sun);clip-path:inset(0 100% 0 0);transition:none}
  #gear.holding .ring{clip-path:inset(0 0 0 0);transition:clip-path 1.2s linear}
  #holdhint{position:fixed;right:14px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:6px 10px;font-size:12px;font-weight:800;color:var(--muted);box-shadow:var(--shadow)}

  #sheet{position:fixed;inset:0;z-index:20;display:grid;align-items:end;background:rgba(10,20,40,.45)}
  .sheet-in{
    background:var(--panel);border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));
    display:grid;gap:14px;max-width:560px;width:100%;margin:0 auto;
    max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;touch-action:pan-y;
  }
  .sheet-in h2{margin:0;font-family:"Fredoka",sans-serif;font-weight:600;font-size:22px}
  .sheet-in p{margin:0;color:var(--muted);font-size:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .btn{
    flex:1 1 140px;height:48px;border-radius:14px;background:var(--track);font-weight:800;font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:8px
  }
  .btn.warn{background:var(--danger);color:#fff}
  .btn.primary{background:var(--sun);color:#2B1B00}
  .animals{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
  .animals button{aspect-ratio:1;border-radius:14px;background:var(--track);padding:6px;border:3px solid transparent}
  .animals button[aria-pressed="true"]{border-color:var(--sun);background:var(--sun-soft)}
  .animals svg{width:100%;height:100%;display:block}
  .sheet-label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  /* Routine editor */
  .editor{display:grid;gap:14px}
  .ed-routine{background:var(--track);border-radius:16px;padding:10px 10px 12px;display:grid;gap:8px}
  .ed-head{display:flex;align-items:center;justify-content:space-between;font-family:"Fredoka",sans-serif;font-weight:600;font-size:16px}
  .ed-head span{font-family:"Nunito",sans-serif;font-weight:800;font-size:12px;color:var(--muted)}
  .ed-list{display:grid;gap:6px}
  .ed-item{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:6px 6px 6px 8px}
  .ed-item svg{width:28px;height:28px;flex:none}
  .ed-item .nm{flex:1;font-weight:800;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ed-item button{width:32px;height:32px;border-radius:9px;background:var(--track);font-weight:900;font-size:14px;display:grid;place-items:center;flex:none}
  .ed-item button:disabled{opacity:.3}
  .ed-item button.rm{background:#FBE3E0;color:#B23B36}
  .ed-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .ed-add small{font-size:12px;font-weight:800;color:var(--muted);flex-basis:100%}
  .ed-add button{width:44px;height:44px;border-radius:12px;background:var(--card);border:2px solid var(--border);display:grid;place-items:center}
  .ed-add button svg{width:28px;height:28px}
  .ed-add button:disabled{opacity:.35}

  /* ---------- Finale ---------- */
  #finale{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(230,242,252,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  body.night #finale{background:rgba(15,27,51,.6)}
  .finale-card{
    background:var(--card);border:3px solid var(--sun);border-radius:30px;padding:26px 28px;text-align:center;
    box-shadow:var(--shadow);display:grid;gap:8px;max-width:420px;width:calc(100% - 40px);animation:pop .5s cubic-bezier(.2,1.4,.4,1) 1
  }
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .finale-card h1{margin:0;font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(34px,9vw,52px);line-height:1;color:var(--ink)}
  .finale-card p{margin:0;color:var(--muted);font-weight:800;font-size:16px}
  .finale-card .stars{font-size:30px}
  .finale-card .stars span{filter:none;opacity:1;animation:twinkle 1.2s ease-in-out infinite}
  .finale-card .stars span:nth-child(odd){animation-delay:.6s}
  @keyframes twinkle{0%,100%{transform:scale(1)}50%{transform:scale(1.25) rotate(10deg)}}
  #confetti{position:fixed;inset:0;z-index:16;pointer-events:none}

  /* ---------- Night routine ---------- */
  body.night{
    color-scheme:dark;
    --sky:#0B1633; --sky2:#152343; --card:#1B2A4A; --ink:#EEF3FF; --muted:#A5B3D1;
    --sun:#FFD36B; --sun-soft:#3A3350; --track:#2A3B60; --knob:#F3F6FF; --border:#33477A; --shadow:0 6px 18px rgba(0,0,0,.35);
    --done:#3FBF7F; --done-ink:#EAFFF3; --hill:#1E4A3A; --hill2:#16392D; --panel:#1B2A4A;
  }
  body.night .sun,body.night .cloud{display:none}
  /* Superhero friend: hovers in the sky at night, cape and mask on */
  body.night .animal-wrap{left:22%;top:15%;bottom:auto;width:min(27vw,135px);z-index:3}
  body.night .animal{animation:hover 2.6s ease-in-out infinite}
  @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-8%)}}
  .cape,.mask{display:none}
  body.night .cape,body.night .mask{display:block}
  #animal-picker .cape,#animal-picker .mask{display:none}
  .cape{transform-box:fill-box;transform-origin:100% 0;animation:flutter .9s ease-in-out infinite}
  @keyframes flutter{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(7deg) scaleX(1.14)}}
  body.night.asleep .eye{transform:scaleY(.18)}
  .animal-wrap.on-moon{transform:translate(calc(-50% + 56cqw), -6cqw) scale(.7)}
  /* Roof stomp (5.6s): fly to the step's house, land on the roof, jump four times, fly home.
     --dx is the horizontal offset to that house, set by script */
  .anim-hero-stomp{animation:heroStomp 5.6s ease-in-out 1}
  @keyframes heroStomp{
    0%  {transform:translate(-50%,0) rotate(0) scaleY(1)}
    8%  {transform:translate(calc(-50% - 6cqw),-4cqh) rotate(-14deg) scaleY(1)}
    21% {transform:translate(calc(-50% + var(--dx,0cqw)),6cqh) rotate(0) scaleY(1)}
    23% {transform:translate(calc(-50% + var(--dx,0cqw)),7.5cqh) rotate(0) scaleY(.88)}
    28% {transform:translate(calc(-50% + var(--dx,0cqw)),-12cqh) rotate(0) scaleY(1.06)}
    35% {transform:translate(calc(-50% + var(--dx,0cqw)),6cqh) rotate(0) scaleY(1)}
    37% {transform:translate(calc(-50% + var(--dx,0cqw)),7.5cqh) rotate(0) scaleY(.88)}
    42% {transform:translate(calc(-50% + var(--dx,0cqw)),-12cqh) rotate(0) scaleY(1.06)}
    49% {transform:translate(calc(-50% + var(--dx,0cqw)),6cqh) rotate(0) scaleY(1)}
    51% {transform:translate(calc(-50% + var(--dx,0cqw)),7.5cqh) rotate(0) scaleY(.88)}
    56% {transform:translate(calc(-50% + var(--dx,0cqw)),-12cqh) rotate(0) scaleY(1.06)}
    63% {transform:translate(calc(-50% + var(--dx,0cqw)),6cqh) rotate(0) scaleY(1)}
    65% {transform:translate(calc(-50% + var(--dx,0cqw)),7.5cqh) rotate(0) scaleY(.88)}
    70% {transform:translate(calc(-50% + var(--dx,0cqw)),-12cqh) rotate(0) scaleY(1.06)}
    78% {transform:translate(calc(-50% + var(--dx,0cqw)),6cqh) rotate(0) scaleY(1)}
    88% {transform:translate(calc(-50% + var(--dx,0cqw) * .4),-6cqh) rotate(-16deg) scaleY(1)}
    100%{transform:translate(-50%,0) rotate(0) scaleY(1)}
  }
  .house{transform-box:fill-box;transform-origin:50% 100%}
  .house.stomp{animation:hstomp .38s ease-out 1}
  @keyframes hstomp{0%{transform:scaleY(1)}35%{transform:scaleY(.93) scaleX(1.03)}100%{transform:scaleY(1)}}
  .anim-hero-land{animation:heroLand 2.6s ease-in-out 1 forwards}
  @keyframes heroLand{
    0%  {transform:translate(-50%,0) rotate(0) scale(1)}
    45% {transform:translate(calc(-50% + 30cqw),-14cqh) rotate(-16deg) scale(.9)}
    100%{transform:translate(calc(-50% + 56cqw),-6cqw) rotate(0) scale(.7)}
  }
  .night-only{display:none}
  body.night .night-only{display:block}
  .starfield{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .starfield i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
  .moon{position:absolute;right:12%;top:15%;width:min(19vw,92px);aspect-ratio:1;filter:drop-shadow(0 0 22px rgba(255,241,184,.45))}
  .moon svg{width:100%;height:100%;display:block;overflow:visible}
  .moon .zz{opacity:0;transition:opacity .8s}
  .moon .awake{transition:opacity .8s}
  body.night.asleep .moon .awake{opacity:0}
  body.night.asleep .moon .zz{opacity:1}
  .town{position:absolute;left:0;right:0;bottom:4%;height:54%;z-index:2}
  .town svg{width:100%;height:100%;display:block;overflow:visible}
  /* A lit house is bright all over; when it sleeps the whole house — walls, roof, door, windows — goes dark */
  .house .wall{fill:var(--wall);transition:fill .9s ease}
  .house .roof{fill:var(--roof);transition:fill .9s ease}
  .house .door{fill:var(--door);transition:fill .9s ease}
  .house .bars{stroke:var(--wall);transition:stroke .9s ease}
  .house.off .wall{fill:var(--wall-d)}
  .house.off .roof{fill:var(--roof-d)}
  .house.off .door{fill:var(--door-d)}
  .house.off .bars{stroke:var(--wall-d)}
  .win{fill:#FFE27A;stroke:#111;stroke-width:1.2;transition:fill .8s ease}
  .win.off{fill:#1A2540}
  .glow{fill:#FFD36B;opacity:.42;transition:opacity .9s ease}
  .glow.off{opacity:0}
  .ring{fill:none;stroke:#D5DDEE;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
  .ring.puff{animation:puff 2.8s ease-out forwards}
  @keyframes puff{0%{opacity:0;transform:translateY(0) scale(.35)}12%{opacity:.85}100%{opacity:0;transform:translateY(-62px) scale(1.9)}}
  .zzz{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:"Fredoka",sans-serif;font-weight:700;color:#EEF3FF;pointer-events:none;opacity:0;transition:opacity 1s}
  body.night.asleep .zzz{opacity:1}
  .zzz span{position:absolute;left:0;animation:zfloat 3.6s ease-out infinite}
  .zzz span:nth-child(1){font-size:18px;left:-40px;animation-delay:0s}
  .zzz span:nth-child(2){font-size:24px;left:-6px;animation-delay:1.2s}
  .zzz span:nth-child(3){font-size:30px;left:34px;animation-delay:2.4s}
  @keyframes zfloat{0%{opacity:0;transform:translateY(20px) rotate(-8deg)}20%{opacity:.95}100%{opacity:0;transform:translateY(-60px) rotate(10deg)}}
  #stage::after{content:"";position:absolute;inset:0;background:#050A19;opacity:0;pointer-events:none;transition:opacity 2s;z-index:1}
  body.night.asleep #stage::after{opacity:.38}
  body:not(.night) #stage::after{transition:none}
  body.night.asleep .starfield i{animation-duration:6s}

  /* ---------- Any-time (ad hoc) mode: dusk sky, task tiles, rocket + fireworks ---------- */
  body.adhoc{
    --sky:#3B2A6B; --sky2:#FFF4EA; --card:#FFFFFF; --ink:#3A2A4A; --muted:#8A7590;
    --sun:#FF7A59; --sun-soft:#FFD3C2; --track:#F3E1D6; --knob:#FFFFFF; --border:#EAD3C4; --shadow:0 6px 18px rgba(90,50,60,.12);
    --done:#47B87A; --done-ink:#0F3D26; --hill:#4F8A6E; --hill2:#3A6B52; --panel:#FFFFFF;
  }
  body.adhoc #stage{background:linear-gradient(180deg,#2E2160 0%,#6E3E8C 45%,#D9646E 78%,#F8A66A 100%)}
  body.adhoc .sun,body.adhoc .cloud{display:none}
  body.adhoc .starfield{display:block;-webkit-mask-image:linear-gradient(#000 0%,#000 40%,transparent 75%);mask-image:linear-gradient(#000 0%,#000 40%,transparent 75%)}
  body.adhoc .greet{color:#FFF4EA}
  body.adhoc .greet small{color:#F5D6E0}
  body.adhoc .stars,body.adhoc #banner{display:none}
  .tiles{display:none;grid-template-columns:repeat(7,1fr);gap:8px;padding:2px 0 4px}
  @media (max-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}.tile svg{width:40px;height:40px}}
  body.adhoc .tiles{display:grid}
  .tile{
    position:relative;aspect-ratio:1;border-radius:18px;background:var(--card);border:2px solid var(--border);box-shadow:var(--shadow);
    display:grid;place-items:center;gap:2px;padding:6px 4px 4px;grid-template-rows:1fr auto;touch-action:manipulation;-webkit-touch-callout:none;
    transition:transform .2s,border-color .3s,background .3s;
  }
  .tile svg{width:min(9vw,44px);height:min(9vw,44px);display:block}
  .tile small{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.02em;line-height:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tile .ring{position:absolute;inset:-2px;border-radius:18px;border:3px solid var(--sun);clip-path:inset(0 100% 0 0);pointer-events:none}
  .tile.holding .ring{clip-path:inset(0 0 0 0);transition:clip-path .6s linear}
  .tile.armed{border-color:var(--sun);background:var(--sun-soft)}
  .tile.armed small{color:#7A2E1A}
  .tile.done{border-color:var(--done);background:#E4F7EC}
  .tile.done::after{content:"✓";position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--done);color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center}
  .tile.wiggle{animation:tileWiggle .4s ease-in-out 1}
  @keyframes tileWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.06)}75%{transform:rotate(8deg) scale(1.06)}}
  .tile.nope{animation:tileNope .45s ease-in-out 1}
  @keyframes tileNope{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .tiles-hint{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding:0 0 6px;display:none}
  body.adhoc .tiles-hint{display:block}
  #toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--card);border-radius:999px;padding:8px 16px;font-weight:800;font-size:14px;box-shadow:var(--shadow);opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.show{opacity:1}
  /* Parachute above the animal (any-time mode only) */
  .chute{position:absolute;left:50%;bottom:68%;width:125%;transform:translateX(-50%);display:none;pointer-events:none}
  .chute svg{width:100%;height:100%;display:block;overflow:visible}
  .wrap-chute .chute{display:block}
  .anim-launch{animation:launch 10s linear 1}
  @keyframes launch{
    0%   {transform:translateX(-50%) translateY(0) scaleY(1)}
    2.4% {transform:translateX(-50%) translateY(2%) scaleY(.88)}
    6.4% {transform:translateX(-50%) translateY(-28%) scaleY(1.06)}
    11.2%{transform:translateX(-50%) translateY(0) scaleY(1)}
    13.6%{transform:translateX(-50%) translateY(3%) scaleY(.84)}
    18.8%{transform:translateX(-50%) translateY(-75%) scaleY(1.08)}
    24%  {transform:translateX(-50%) translateY(0) scaleY(1)}
    26.8%{transform:translateX(-50%) translateY(4%) scaleY(.78)}
    28.8%{transform:translateX(-50%) translateY(-30%) scaleY(1.12)}
    38.4%{transform:translateX(-50%) translateY(-220cqh) scaleY(1.04)}
    56%  {transform:translateX(-50%) translateY(-220cqh) rotate(0) scale(.5)}
    58%  {transform:translateX(calc(-50% - 3cqw)) translateY(-40cqh) rotate(-3deg) scale(.5)}
    61%  {transform:translateX(calc(-50% - 5cqw)) translateY(-27cqh) rotate(-5deg) scale(.55)}
    68%  {transform:translateX(calc(-50% + 8cqw)) translateY(-22cqh) rotate(6deg) scale(.62)}
    76%  {transform:translateX(calc(-50% - 8cqw)) translateY(-16cqh) rotate(-6deg) scale(.72)}
    84%  {transform:translateX(calc(-50% + 7cqw)) translateY(-10cqh) rotate(6deg) scale(.84)}
    91%  {transform:translateX(calc(-50% - 4cqw)) translateY(-4cqh) rotate(-4deg) scale(.94)}
    95%  {transform:translateX(calc(-50% + 1cqw)) translateY(-1cqh) rotate(1deg) scale(1)}
    96.5%{transform:translateX(-50%) translateY(2%) scaleY(.88) rotate(0)}
    98.5%{transform:translateX(-50%) translateY(-3%) scaleY(1.04)}
    100% {transform:translateX(-50%) translateY(0) scaleY(1)}
  }
  /* Mountains behind the hill in the morning */
  .mountains{position:absolute;left:0;right:0;bottom:14%;height:46%;pointer-events:none}
  body.night .mountains,body.adhoc .mountains{display:none}
  .mountains svg{width:100%;height:100%;display:block}
  .birds{position:absolute;left:-60px;top:20%;width:60px;height:24px;animation:drift 70s linear infinite;animation-delay:-30s;pointer-events:none}
  body.night .birds,body.adhoc .birds{display:none}
  .birds svg{width:100%;height:100%;overflow:visible}
  .birds path{animation:flap .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  @keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
  /* City skyline behind the hill in any-time mode */
  .skyline{position:absolute;left:0;right:0;bottom:16%;height:44%;display:none;pointer-events:none}
  body.adhoc .skyline{display:block}
  .skyline svg{width:100%;height:100%;display:block;overflow:visible}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:17;transition:opacity .08s}
  #flash.on{opacity:.85}
</style>
</head>
<body>

<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);

  /* ---------- Content ---------- */

    poop: I(`<g transform="translate(0,-3.3)"><path d="M5 38 C5 30 11 28 17 28.5 H33 C40 28 43 31 43 38 C43 44 38 45 33 45 H14 C8 45 5 44 5 38 Z" fill="#8E5A2B"/>

      <path d="M17 19.5 C15 12 19 9.5 24 9.5 C29 9.5 32.5 13 31 19.5 Z" fill="#8E5A2B"/>

      <path d="M9 39 C11 34.5 15 33 20 33.5 M15 25.5 C17 22.5 20 22 23 22.3 M20 15.5 C21.5 12.8 23.5 12.5 25 12.8" fill="none" stroke="#B9835A" stroke-width="2.2" stroke-linecap="round"/></g>`),
    hands: I(`<path d="M13 40 V22 Q13 18 17 18 Q21 18 21 22 V14 Q21 10 25 10 Q29 10 29 14 V12 Q29 8 33 8 Q37 8 37 12 V16 Q37 12 41 12 Q45 12 45 16 V30 Q45 40 36 43 H21 Q13 43 13 40 Z" fill="#F5D0B5"/>
      <path d="M21 22 V30 M29 14 V30 M37 16 V30" stroke="#C99A78" stroke-width="2"/>
      <circle cx="10" cy="14" r="4" fill="#DDF0FF" stroke-width="2"/><circle cx="7" cy="25" r="2.5" fill="#DDF0FF" stroke-width="2"/><circle cx="15" cy="8" r="2.5" fill="#DDF0FF" stroke-width="2"/>
      <path d="M40 38 q3 3 0 6 M44 34 q3 3 0 6" fill="none" stroke="#4FA3F5" stroke-width="2.5"/>`),
  };

  function confetti(){
    const cv = $('#confetti'), cx = cv.getContext('2d'); cv.hidden = false;
    const dpr = Math.min(window.devicePixelRatio||1, 2); cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; cx.scale(dpr,dpr);
    const colors = ['#FFB020','#47B87A','#5AA9FF','#F06292','#FFD84D','#B388FF'];
    const ps = Array.from({length:160}, ()=>({x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*0.5, vx:(Math.random()-.5)*2.5, vy:2+Math.random()*3.5, r:5+Math.random()*6, rot:Math.random()*6.28, vr:(Math.random()-.5)*.3, c:pick(colors)}));
    const t0 = performance.now();
    (function frame(now){
      const el = (now - t0)/1000; cx.clearRect(0,0,innerWidth,innerHeight);
      ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vy+=0.02; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.c; cx.globalAlpha = el>3.2 ? Math.max(0, 1-(el-3.2)/0.8) : 1; cx.fillRect(-p.r/2,-p.r/3,p.r,p.r*0.66); cx.restore(); });
      if (el < 4) requestAnimationFrame(frame); else { cv.hidden = true; cx.setTransform(1,0,0,1,0,0); }
    })(t0);
  }

  /* ---------- Fireworks ---------- */
  function fireworks(bursts){
    const cv = $('#confetti'), cx = cv.getContext('2d'); cv.hidden = false;
    const dpr = Math.min(window.devicePixelRatio||1, 2); cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    const palette = ['#FF5E7A','#FFD36B','#5AC8FA','#7CFF9B','#FF9B3D','#C77DFF','#FFFFFF'];
    const stageH = $('#stage').getBoundingClientRect().height;
    const rockets = [], parts = [];
    const RISE = 0.55; // seconds from launch to burst, the same on every screen refresh rate
    bursts.forEach(b => rockets.push({ launchAt:b.t-RISE, x: innerWidth*(0.15+Math.random()*0.7), y0: innerHeight*0.62, y: innerHeight*0.62, ty: stageH*(0.12+Math.random()*0.35), big:b.big, c:pick(palette), c2:pick(palette), fired:false, exploded:false, trail:0 }));
    const flash = $('#flash');
    const t0 = performance.now(); let last = t0;
    (function frame(now){
      const el = (now - t0)/1000, dt = Math.min((now-last)/1000, .05); last = now;
      cx.clearRect(0,0,innerWidth,innerHeight);
      rockets.forEach(r => {
        if (!r.fired && el >= r.launchAt) r.fired = true;
        if (r.fired && !r.exploded){
          const u = Math.min((el - r.launchAt) / RISE, 1), k = 1 - Math.pow(1 - u, 2);   // eased climb, time-based
          r.y = r.y0 + (r.ty - r.y0) * k;
          r.trail += dt * 180;
          while (r.trail >= 1){ r.trail -= 1; parts.push({x:r.x+(Math.random()-.5)*4, y:r.y+Math.random()*10, vx:(Math.random()-.5)*20, vy:20+Math.random()*30, life:.35, age:0, r:1.6, c:'#FFE9A8'}); }
          if (u >= 1){
            r.exploded = true;
            const n = r.big ? 150 : 90, sp = r.big ? 260 : 190;
            for (let k=0;k<n;k++){ const a = Math.random()*Math.PI*2, v = sp*(0.35+Math.random()*0.65); parts.push({x:r.x, y:r.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1.3+Math.random()*0.8, age:0, r:r.big?3.2:2.6, c: Math.random()<.7 ? r.c : r.c2, spark:true}); }
            if (r.big){ flash.classList.add('on'); setTimeout(()=>flash.classList.remove('on'), 90); }
          }
        }
      });
      for (let i=parts.length-1;i>=0;i--){
        const p = parts[i]; p.age += dt; if (p.age >= p.life){ parts.splice(i,1); continue; }
        p.x += p.vx*dt; p.y += p.vy*dt; if (p.spark){ p.vy += 140*dt; p.vx *= 0.985; p.vy *= 0.985; }
        const k = 1 - p.age/p.life; cx.globalAlpha = p.spark ? (k < .3 ? k/.3 * (Math.random()<.85?1:.2) : 1) : k;
        cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.r*(p.spark? (0.6+0.4*k) : 1), 0, 6.283); cx.fill();
      }
      cx.globalAlpha = 1;
      const done = el > 1 && rockets.every(r=>r.exploded) && parts.length === 0;
      if (!done && el < 7) requestAnimationFrame(frame); else { cv.hidden = true; cx.setTransform(1,0,0,1,0,0); }
    })(t0);
  }

  /* ---------- Midnight rollover while open ---------- */
  setInterval(()=>{ if (!busy && day.date !== todayKey()){ day = freshDay(); save('mf_day', day); renderAnimal(); buildSteps(); renderProgress(); renderTown(); } }, 60000);
  window.addEventListener('resize', ()=>renderProgress());

  setInterval(expireAdhoc, 5000);

  /* ---------- Boot ---------- */
  buildTown(); buildTiles(); buildSkyline(); renderAnimal(); expireAdhoc();
  document.body.classList.toggle('night', isNight());
  buildSteps(); renderProgress(); renderTown();
  $('#sound').textContent = settings.sound ? '🔊' : '🔇';
})();
</script>
